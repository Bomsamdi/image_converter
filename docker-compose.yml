services:
    converter:
        build: .
        ports:
            - "8080:8080"
        environment:
            docker: "true"
            APP_DEBUG: "false"
            # Every limit is tunable without touching the code.
            MAX_IMAGE_BYTES: "20971520"
            MAX_IMAGE_PIXELS: "40000000"
            MAX_ARCHIVE_ENTRIES: "500"
            MAX_ARCHIVE_BYTES: "209715200"
            OUTPUT_QUALITY: "82"
        volumes:
            - .:/var/www
